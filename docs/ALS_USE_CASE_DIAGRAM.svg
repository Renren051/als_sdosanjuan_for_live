    .ucLabel { font:600 24px Arial,sans-serif; fill:#172b45; text-anchor:middle; }
    .relation { fill:none; stroke:#475569; stroke-width:2.5; stroke-dasharray:8 7; marker-end:url(#arrow); }
    .relLabel { font:700 18px Arial,sans-serif; fill:#3b4c62; text-anchor:middle; }
  </style>
