  <style>
    .frame { fill:none; stroke:#718096; stroke-width:2.5; }
    .frameTitle { font:700 30px Arial,sans-serif; fill:#243247; }
    .actor { fill:none; stroke:#334155; stroke-width:4; stroke-linecap:round; stroke-linejoin:round; }
    .actorLabel { font:600 24px Arial,sans-serif; fill:#243247; text-anchor:middle; }
    .association { fill:none; stroke:#8593a4; stroke-width:2.2; opacity:.72; }
