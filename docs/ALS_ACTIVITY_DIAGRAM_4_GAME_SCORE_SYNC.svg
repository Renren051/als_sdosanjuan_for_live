<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1480" viewBox="0 0 1600 1480" role="img" aria-labelledby="title desc">
  <title id="title">Activity Diagram 4 — Educational Game and Score Synchronization</title>
  <desc id="desc">A UML-style activity diagram for offline module game play, score capture, queued synchronization, server validation, and teacher progress reporting.</desc>
  <defs>
    
    
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L10 5.5 L0 11 z" fill="#43566B"/></marker>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1E293B" flood-opacity="0.13"/></filter>
    <style>
      .title{font:700 31px 'Segoe UI',Arial,sans-serif;fill:#263746}.subtitle{font:400 16px 'Segoe UI',Arial,sans-serif;fill:#647587}
      .action{fill:#303B70;stroke:#1F2C57;stroke-width:2}.actionTitle{font:700 17px 'Segoe UI',Arial,sans-serif;fill:#FFF}.owner{font:700 10px 'Segoe UI',Arial,sans-serif;letter-spacing:1.15px;fill:#B9C8F4}
      .decision{fill:#FFF;stroke:#303B70;stroke-width:2.5}.decisionText{font:700 14px 'Segoe UI',Arial,sans-serif;fill:#283553}.flow{fill:none;stroke:#43566B;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.branch{font:700 12px 'Segoe UI',Arial,sans-serif;fill:#4D6074}.endLabel{font:600 13px 'Segoe UI',Arial,sans-serif;fill:#34495E}
    </style>
  </defs>
  
  <text class="title" x="800" y="62" text-anchor="middle">Appendix C. Activity Diagram 4</text>
  <text class="subtitle" x="800" y="92" text-anchor="middle">Interactive Module Games &amp; Score Synchronization</text>

  <g filter="url(#shadow)">
    <circle cx="800" cy="125" r="16" fill="#101820"/><text class="endLabel" x="830" y="130">Start</text>
    <rect class="action" x="600" y="180" width="400" height="82" rx="15"/>
    <text class="owner" x="800" y="208" text-anchor="middle">LEARNER</text><text class="actionTitle" x="800" y="238" text-anchor="middle">Complete the module and open its game</text>
    <rect class="action" x="600" y="285" width="400" height="82" rx="15"/>
    <text class="owner" x="800" y="313" text-anchor="middle">ANDROID APP</text><text class="actionTitle" x="800" y="343" text-anchor="middle">Load cached, strand-aligned questions</text>
    <rect class="action" x="600" y="390" width="400" height="95" rx="15"/>
    <text class="owner" x="800" y="418" text-anchor="middle">LEARNER / GAME</text><text class="actionTitle" x="800" y="448" text-anchor="middle">Show a question, record the answer,</text><text class="actionTitle" x="800" y="471" text-anchor="middle">and give immediate feedback</text>
    <polygon class="decision" points="800,515 865,555 800,595 735,555"/><text class="decisionText" x="800" y="560" text-anchor="middle">More questions?</text>
    <rect class="action" x="600" y="640" width="400" height="85" rx="15"/>
    <text class="owner" x="800" y="668" text-anchor="middle">ANDROID APP</text><text class="actionTitle" x="800" y="698" text-anchor="middle">Calculate score and save attempt locally</text>
    <polygon class="decision" points="800,760 865,800 800,840 735,800"/><text class="decisionText" x="800" y="805" text-anchor="middle">Connected?</text>
    <rect class="action" x="600" y="900" width="400" height="82" rx="15"/>
    <text class="owner" x="800" y="928" text-anchor="middle">WORKMANAGER / ANDROID APP</text><text class="actionTitle" x="800" y="958" text-anchor="middle">Send batch to /sync-game-scores</text>
    <rect class="action" x="600" y="1000" width="400" height="92" rx="15"/>
    <text class="owner" x="800" y="1028" text-anchor="middle">LARAVEL API</text><text class="actionTitle" x="800" y="1058" text-anchor="middle">Validate learner, completed module,</text><text class="actionTitle" x="800" y="1080" text-anchor="middle">and duplicate attempt</text>
    <rect class="action" x="600" y="1110" width="400" height="82" rx="15"/>
    <text class="owner" x="800" y="1138" text-anchor="middle">SYSTEM</text><text class="actionTitle" x="800" y="1168" text-anchor="middle">Store game attempt and return sync result</text>
    <rect class="action" x="600" y="1210" width="400" height="92" rx="15"/>
    <text class="owner" x="800" y="1238" text-anchor="middle">ANDROID APP / MOBILE TEACHER</text><text class="actionTitle" x="800" y="1268" text-anchor="middle">Mark attempt synced; teacher can view</text><text class="actionTitle" x="800" y="1290" text-anchor="middle">the learner's score and progress</text>
    <circle cx="800" cy="1400" r="16" fill="#FFF" stroke="#101820" stroke-width="4"/><circle cx="800" cy="1400" r="7" fill="#101820"/><text class="endLabel" x="830" y="1405">End: Score Synced</text>
    <rect class="action" x="80" y="755" width="400" height="90" rx="15"/>
    <text class="owner" x="280" y="783" text-anchor="middle">ANDROID APP</text><text class="actionTitle" x="280" y="813" text-anchor="middle">Keep attempt locally until connected</text>
  </g>

  <g aria-label="Activity flows">
    <path class="flow" d="M800 141 V174" marker-end="url(#arrow)"/><path class="flow" d="M800 262 V279" marker-end="url(#arrow)"/>
    <path class="flow" d="M800 367 V384" marker-end="url(#arrow)"/><path class="flow" d="M800 485 V509" marker-end="url(#arrow)"/>
    <path class="flow" d="M865 555 H1120 V437 H1008" marker-end="url(#arrow)"/><text class="branch" x="900" y="543">Yes</text>
    <path class="flow" d="M800 595 V634" marker-end="url(#arrow)"/><text class="branch" x="812" y="623">No</text>
    <path class="flow" d="M800 725 V754" marker-end="url(#arrow)"/>
    <path class="flow" d="M800 840 V893" marker-end="url(#arrow)"/><text class="branch" x="812" y="880">Yes</text>
    <path class="flow" d="M735 800 H485" marker-end="url(#arrow)"/><text class="branch" x="600" y="788">No</text>
    <path class="flow" d="M480 800 H550 V865 H800 V893" marker-end="url(#arrow)"/><text class="branch" x="390" y="878">Retry after reconnect</text>
    <path class="flow" d="M800 982 V993" marker-end="url(#arrow)"/><path class="flow" d="M800 1092 V1103" marker-end="url(#arrow)"/>
    <path class="flow" d="M800 1192 V1203" marker-end="url(#arrow)"/><path class="flow" d="M800 1302 V1376" marker-end="url(#arrow)"/>
  </g>
</svg>
