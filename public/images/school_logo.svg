<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="depedBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0038A8" />
      <stop offset="100%" stop-color="#001F5C" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD116" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>
  <!-- Outer Ring -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="url(#depedBlueGrad)" stroke-width="8"/>
  <circle cx="100" cy="100" r="88" fill="#FFFFFF" stroke="url(#goldGrad)" stroke-width="3"/>
  
  <!-- Outer Circular Text Track -->
  <path id="textPathTop" d="M 28 100 A 72 72 0 0 1 172 100" fill="none"/>
  <path id="textPathBottom" d="M 172 100 A 72 72 0 0 1 28 100" fill="none"/>
  <text font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="10.5" font-weight="800" fill="#0038A8" letter-spacing="1.5">
    <textPath href="#textPathTop" startOffset="50%" text-anchor="middle">DEPARTMENT OF EDUCATION</textPath>
  </text>
  <text font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="10" font-weight="800" fill="#CE1126" letter-spacing="1.5">
    <textPath href="#textPathBottom" startOffset="50%" text-anchor="middle">SDO SAN JUAN CITY</textPath>
  </text>
  
  <!-- Central Shield / Constructivist Symbolism -->
  <circle cx="100" cy="100" r="54" fill="url(#depedBlueGrad)"/>
  
  <!-- Sun Rays (Philippine Flag 8 Rays Stylized) -->
  <g fill="url(#goldGrad)">
    <polygon points="100,56 103,72 97,72" />
    <polygon points="100,144 103,128 97,128" />
    <polygon points="56,100 72,103 72,97" />
    <polygon points="144,100 128,103 128,97" />
    <polygon points="69,69 82,78 78,82" />
    <polygon points="131,131 118,122 122,118" />
    <polygon points="131,69 122,82 118,78" />
    <polygon points="69,131 78,118 82,122" />
  </g>
  
  <!-- Open Book & Torch -->
  <!-- Book Base -->
  <path d="M 78 116 Q 100 122 100 112 Q 100 122 122 116 L 122 102 Q 100 108 100 98 Q 100 108 78 102 Z" fill="#FFFFFF"/>
  <path d="M 80 114 Q 100 120 100 110 Q 100 120 120 114 L 120 104 Q 100 109 100 100 Q 100 109 80 104 Z" fill="url(#goldGrad)"/>
  <!-- Torch / Flame -->
  <path d="M 100 76 Q 106 85 100 96 Q 94 85 100 76 Z" fill="#CE1126"/>
  <path d="M 100 81 Q 103 87 100 93 Q 97 87 100 81 Z" fill="url(#goldGrad)"/>
  <!-- Base handle -->
  <polygon points="98,96 102,96 101,104 99,104" fill="#FFFFFF"/>
  
  <!-- 3 Stars -->
  <polygon points="100,50 101.5,54 105,54 102,56.5 103,60 100,57.5 97,60 98,56.5 95,54 98.5,54" fill="#FCD116"/>
  <polygon points="62,94 63.5,98 67,98 64,100.5 65,104 62,101.5 59,104 60,100.5 57,98 60.5,98" fill="#FCD116"/>
  <polygon points="138,94 139.5,98 143,98 140,100.5 141,104 138,101.5 135,104 136,100.5 133,98 136.5,98" fill="#FCD116"/>
</svg>
