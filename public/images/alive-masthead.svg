<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" width="100%" height="100%">
  <rect width="600" height="240" fill="#ffffff" rx="12" stroke="#e2e8f0" stroke-width="2"/>
  
  <!-- Left Division Emblem Graphic -->
  <g transform="translate(45, 60)">
    <circle cx="28" cy="28" r="26" fill="#f8fafc" stroke="#1b387a" stroke-width="2.5"/>
    <circle cx="28" cy="28" r="21" fill="#fef08a" stroke="#ca8a04" stroke-width="1.5"/>
    <text x="28" y="24" font-family="Arial, sans-serif" font-size="6" font-weight="bold" text-anchor="middle" fill="#0f172a">CITY OF SAN JUAN</text>
    <text x="28" y="34" font-family="Arial, sans-serif" font-size="8" font-weight="900" text-anchor="middle" fill="#b91c1c">NCR</text>
    <text x="28" y="42" font-family="Arial, sans-serif" font-size="5" font-weight="bold" text-anchor="middle" fill="#1e3a8a">2008</text>
  </g>

  <!-- Right DepEd Seal Graphic -->
  <g transform="translate(495, 60)">
    <circle cx="28" cy="28" r="26" fill="#f8fafc" stroke="#0038a8" stroke-width="2.5"/>
    <circle cx="28" cy="28" r="21" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="28" y="25" font-family="Arial, sans-serif" font-size="6" font-weight="bold" text-anchor="middle" fill="#0038a8">KAGAWARAN</text>
    <text x="28" y="34" font-family="Arial, sans-serif" font-size="6" font-weight="bold" text-anchor="middle" fill="#0038a8">NG EDUKASYON</text>
  </g>

  <!-- Official Masthead Header Text -->
  <g text-anchor="middle" font-family="'Times New Roman', Times, serif" fill="#0f172a">
    <text x="300" y="28" font-size="11" letter-spacing="0.5">Republic of the Philippines</text>
    <text x="300" y="42" font-size="13" font-weight="bold" letter-spacing="1">DEPARTMENT OF EDUCATION</text>
    <text x="300" y="55" font-size="11" font-style="italic">National Capital Region</text>
    <text x="300" y="69" font-size="12" font-weight="bold" letter-spacing="0.5">DIVISION OF CITY SCHOOLS</text>
    <text x="300" y="85" font-size="15" font-weight="bold" letter-spacing="1.5">SAN JUAN CITY</text>
    <text x="300" y="99" font-size="10" fill="#475569">Pinaglabanan St., City of San Juan</text>
  </g>

  <!-- Dividing Line -->
  <line x1="30" y1="112" x2="570" y2="112" stroke="#0f172a" stroke-width="2.5"/>
  <line x1="30" y1="116" x2="570" y2="116" stroke="#0f172a" stroke-width="0.8"/>

  <!-- ALIVE NEWS UPDATE Big Headline -->
  <text x="300" y="162" text-anchor="middle" font-family="'Arial Black', Impact, sans-serif" font-size="36" font-weight="900" letter-spacing="2" fill="#020617">
    ALIVE NEWS UPDATE
  </text>

  <!-- Tagline & Publication Date -->
  <text x="300" y="188" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.5" font-style="italic" fill="#334155">
    Vol 1. No. 3 Ang opisyal na pahayagan ng ALIVE Program ng Sangay ng Lungsod ng San Juan
  </text>
  <text x="300" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0f172a">
    October 2015
  </text>
</svg>
